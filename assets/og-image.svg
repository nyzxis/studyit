<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="stIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#stBg)"/>
  <circle cx="1050" cy="120" r="420" fill="url(#stIndigo)"/>
  <circle cx="150" cy="500" r="360" fill="url(#stViolet)"/>

  <!-- Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="28" fill="rgba(30, 27, 75, 0.5)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Badge -->
  <g transform="translate(110, 105)">
    <rect width="280" height="38" rx="19" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="5" fill="#818cf8"/>
    <text x="36" y="24" fill="#c7d2fe" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PRODUCTIVITY // STUDY DOCK</text>
  </g>

  <!-- Title -->
  <text x="110" y="225" fill="#ffffff" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">StudyIt Knowledge Hub</text>

  <!-- Subtitle -->
  <text x="110" y="285" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="400">
    Distraction-free desktop study workstation with Pomodoro timer, notes &amp; self-testing.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(110, 350)">
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="85" y="24" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">⏱️ Pomodoro Timer</text>
    </g>
    <g transform="translate(185, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="90" y="24" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🎧 Ambient Audio</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="90" y="24" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">📝 Active Recall</text>
    </g>
    <g transform="translate(575, 0)">
      <rect width="180" height="38" rx="10" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)"/>
      <text x="90" y="24" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">📊 Progress Dock</text>
    </g>
  </g>

  <!-- Author branding -->
  <text x="110" y="470" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600">
    ENGINEERED BY ARFA DANIAL (@NYZXIS) • HTTPS://STUDYITPI.VERCEL.APP/
