<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Learning Port</title>
  <meta name="theme-color" content="#F7F6F3">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/enhance.css">
  <link rel="stylesheet" href="css/motion.css">
  <script src="js/boot.js"></script>
  <script src="js/vendor/anime.umd.min.js"></script>
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <span class="mark"><svg viewBox="0 0 40 40" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="38" height="38" rx="10" fill="var(--ink)"/><path d="M13 27V13h6.2c3.3 0 5.6 2.1 5.6 5.2s-2.3 5.2-5.6 5.2H16v3.6h-3z" fill="var(--bg)"/><path d="M16 15.8v4.9h3.1c1.6 0 2.7-1 2.7-2.45s-1.1-2.45-2.7-2.45H16z" fill="var(--accent)"/><circle cx="29" cy="12" r="2.4" fill="var(--bg)"/></svg></span>
        <span>LEARNING PORT</span>
      </a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Sign in to sync your progress across devices.</p>

      <form class="auth-form" id="loginForm">
        <label class="auth-label">
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="email">
        </label>
        <label class="auth-label">
          <span>Password</span>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary auth-btn">Sign in</button>
        <p class="auth-error" id="loginError" role="alert"></p>
      </form>

      <p class="auth-foot">
        No account? <a href="signup.html">Create one</a>
      </p>
    </div>
  </main>
</body>
</html>
