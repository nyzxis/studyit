<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic · Learning Port</title>
<meta name="theme-color" content="#F7F6F3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='1' y='1' width='38' height='38' rx='10' fill='%231B1B1A'/%3E%3Cpath d='M13 27V13h6.2c3.3 0 5.6 2.1 5.6 5.2s-2.3 5.2-5.6 5.2H16v3.6h-3z' fill='%23F7F6F3'/%3E%3Ccircle cx='29' cy='12' r='2.4' fill='%234F46E5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script src="js/boot.js"></script>
<link rel="stylesheet" href="css/enhance.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body>

<div class="reading-bar" id="readingBar"></div>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <span class="mark js-logo"></span>
      <span>LEARNING PORT<small>focus study hub</small></span>
    </a>
    <nav class="nav-links">
      <a href="index.html#subjects">Subjects</a>
      <a href="index.html#progressMap">Progress</a>
      <a href="index.html#badges">Badges</a>
    </nav>
    <div class="progress-chip" id="headerProgress"><span class="led"></span> 0/0 topics connected</div>
  </div>
</header>

<main>
  <section style="padding-top:40px; padding-bottom:0;">
    <div class="wrap">
      <div class="breadcrumb">
        <a href="index.html">Home</a> <span>/</span>
        <a id="crumbSubject" href="subject.html">Subject</a> <span>/</span>
        <span id="crumbTopic">Topic</span>
      </div>

      <div class="topic-hero">
        <span class="icon-box" id="topicIcon"></span>
        <div class="topic-hero-text">
          <div class="content-eyebrow" id="topicEyebrow">SUBJECT · TOPIC 00</div>
          <h1 class="content-title" id="topicTitle">Topic title</h1>
          <p class="content-summary" id="topicSummary">Summary</p>
          <div class="topic-meta-row">
            <button class="mark-done" id="markDoneBtn">Mark topic as reviewed</button>
            <a class="btn btn-primary" id="quizLink" href="#">Take the self-test</a>
            <span class="progress-chip" id="quizScoreChip" style="display:none;"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:8px;">
    <div class="wrap">
      <div class="notes-layout">
        <div class="notes-main" id="notesMain"></div>
        <aside class="toc" id="toc">
          <div class="toc-label">On this page</div>
          <div id="tocLinks"></div>
        </aside>
      </div>

      <div class="topic-pager" id="topicPager"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap footer-row">
    <span>LEARNING PORT · built for Dani's coursework</span>
    <span>© <span id="year"></span> · progress saved locally in your browser</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>

<script src="js/common.js"></script>
<script src="js/topic.js"></script>
<script src="js/notes.js"></script>
<script src="js/achievements.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/reveal.js"></script>
<script src="js/spotlight.js"></script>
<script src="js/smart.js"></script>
<script src="js/motion.js"></script>

</body>
</html>
